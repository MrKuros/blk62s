[project]
name = "firmwind-api"
version = "0.1.0"
description = "Firm Wind API: day-ahead wind forecast replay and accuracy for GB"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "numpy>=2.1",
    "pandas>=2.2",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8.3", "ruff>=0.8"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
